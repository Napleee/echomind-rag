# EchoMind 前端 Nginx 配置: 静态托管 + 后端反向代理（同源免 CORS）
server {
    listen 80;
    server_name _;

    # 前端静态资源（Vite 产物带内容哈希，可放心长缓存）
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        # SPA history 路由回退: /chat、/documents 等路径刷新后仍返回 index.html
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理（backend 是 compose 服务名，容器间内网直连）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # SSE 流式回答三件套: 关缓冲、关缓存、拉长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
