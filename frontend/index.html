<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EchoMind 回声 — 基于 RAG 的文档知识库问答系统" />
    <title>EchoMind 回声</title>
    <script>
      // 首帧前同步主题，避免刷新闪回默认樱花（与音阅同款手法）
      try {
        var t = localStorage.getItem('echomind-theme');
        if (t === 'paper' || t === 'miku') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
